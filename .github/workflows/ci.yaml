name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [data_updated]

concurrency:
  # Include the event name so a push build and a data_updated dispatch build do
  # not cancel each other (both run on refs/heads/main).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      WORKSPACE_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Checkout data repo
        uses: actions/checkout@v7
        with:
          repository: jifffffy/trail-data
          path: data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      - name: Build data
        env:
          LEADERBOARD_DATA_DIR: ./data
        run: pnpm build:data

      - name: Build web
        env:
          LEADERBOARD_DATA_DIR: ./data
        run: pnpm build:web

      - name: Disable Jekyll
        run: touch apps/web/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Serialize Pages deployments across concurrent builds (queue, don't cancel),
    # so a push build and a dispatch build can run in parallel but publish safely.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
